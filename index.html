!DOCTYPE html>

<title>Notas Express - PWA Style</title> <style> :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --accent-color: #38bdf8; --delete-color: #ef4444; }
    body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 16px;
        padding-bottom: 90px; /* Espacio para el panel inferior */
        box-sizing: border-box;
        user-select: none;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    header h1 {
        font-size: 24px;
        margin: 0;
        color: var(--accent-color);
    }

    .notes-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .note-card {
        background-color: var(--card-bg);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid #334155;
        position: relative;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .note-card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
    }

    .note-card .date {
        font-size: 11px;
        color: #64748b;
        margin-top: 8px;
        display: block;
    }

    .delete-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        border: none;
        color: var(--delete-color);
        font-size: 18px;
        cursor: pointer;
        padding: 4px;
    }

    /* Barra de entrada inferior estilo App Móvil nativa */
    .input-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: #1e293b;
        padding: 12px 16px;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
        display: flex;
        gap: 10px;
        align-items: center;
        border-top: 1px solid #334155;
    }

    .input-panel textarea {
        flex: 1;
        background-color: #0f172a;
        border: 1px solid #475569;
        border-radius: 20px;
        color: var(--text-color);
        padding: 10px 16px;
        font-size: 15px;
        resize: none;
        height: 22px;
        outline: none;
        font-family: inherit;
    }

    .input-panel textarea:focus {
        border-color: var(--accent-color);
    }

    .add-btn {
        background-color: var(--accent-color);
        color: #0f172a;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
    }
</style>
<header>
    <h1>⚡ Mis Notas</h1>
    <span id="counter" style="font-size: 14px; color: #64748b;">0 notas</span>
</header><

<div class="notes-grid" id="notesContainer">
    <!-- Las notas se generarán dinámicamente aquí -->
</div>

<!-- Panel de escritura flotante nativo de Android -->
<div class="input-panel">
    <textarea id="noteInput" placeholder="Escribe una nota..."></textarea>
    <button class="add-btn" id="saveBtn">+</button>
</div>

<script>
    const noteInput = document.getElementById('noteInput');
    const saveBtn = document.getElementById('saveBtn');
    const notesContainer = document.getElementById('notesContainer');
    const counter = document.getElementById('counter');

    // Cargar notas guardadas en la memoria del celular al abrir la app
    let notes = JSON.parse(localStorage.getItem('my_pwa_notes')) || [];

    function updateUI() {
        notesContainer.innerHTML = '';
        counter.innerText = `${notes.length} ${notes.length === 1 ? 'nota' : 'notas'}`;

        notes.forEach((note, index) => {
            const card = document.createElement('div');
            card.className = 'note-card';
            card.innerHTML = `
                <p>${escapeHTML(note.text)}</p>
                <span class="date">${note.date}</span>
                <button class="delete-btn" onclick="deleteNote(${index})">✕</button>
            `;
            notesContainer.appendChild(card);
        });
    }

    function saveNote() {
        const text = noteInput.value.trim();
        if (!text) return;

        const newNote = {
            text: text,
            date: new Date().toLocaleDateString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };

        notes.unshift(newNote); // Agregar al principio
        localStorage.setItem('my_pwa_notes', JSON.stringify(notes)); // Guardar en disco duro local
        noteInput.value = ''; // Limpiar el input
        updateUI();
        
        // Efecto sutil de vibración nativa si el móvil lo soporta al guardar
        if (navigator.vibrate) navigator.vibrate(15);
    }

    function deleteNote(index) {
        notes.splice(index, 1);
        localStorage.setItem('my_pwa_notes', JSON.stringify(notes));
        updateUI();
        if (navigator.vibrate) navigator.vibrate(10);
    }

    // Evitar inyección de código malicioso en el texto de la nota
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    saveBtn.addEventListener('click', saveNote);
    
    // Permitir guardar con Enter (pero Shift+Enter para salto de línea)
    noteInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            saveNote();
        }
            });

    // Inicializar la interfaz al cargar
    updateUI();
  
    // El manifest NO va aquí. Aquí solo va el activador de fondo:
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registrado con éxito', reg))
                .catch(err => console.error('Error al registrar el Service Worker', err));
        });
    }

</script>
